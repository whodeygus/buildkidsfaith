name: Supabase keep-alive

# Free-tier Supabase projects auto-pause after 7 days with no API activity.
# This pings the project every few days so it never pauses due to a quiet site.
on:
  schedule:
    - cron: '0 12 */4 * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        run: |
          curl -sS -o /dev/null -w "%{http_code}\n" \
            "${SUPABASE_URL}/rest/v1/subscribers?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
