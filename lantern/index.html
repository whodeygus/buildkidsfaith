<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>The Little Lantern</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:"Courier New",monospace}
  #game{display:block;margin:0 auto;image-rendering:pixelated;image-rendering:crisp-edges;background:#000}
  #controls{display:none}
  body.touch #controls{display:block}
  #dpad{position:fixed;left:18px;bottom:22px;width:150px;height:150px;border-radius:50%;
    background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.25);touch-action:none}
  #dpad .arr{position:absolute;width:46px;height:46px;border-radius:10px;background:rgba(255,255,255,.18);
    color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;pointer-events:none}

const W=320,H=240,T=16,MW=60,MH=15;
const cv=document.getElementById('game');
const ctx=cv.getContext('2d');
cv.width=W*2; cv.height=H*2;
ctx.imageSmoothingEnabled=false;

const isTouch=(window.matchMedia&&matchMedia('(pointer:coarse)').matches)||('ontouchstart' in window);
if(isTouch) document.body.classList.add('touch');
function resize(){
  let w;
  if(isTouch && innerWidth<innerHeight){ w=Math.min(innerWidth,(innerHeight-200)*4/3); }
  else if(isTouch){ w=Math.min(innerWidth-300,innerHeight*4/3); if(w<240) w=Math.min(innerWidth,innerHeight*4/3); }
  else { w=Math.min(innerWidth,innerHeight*4/3); }
  cv.style.width=Math.floor(w)+'px'; cv.style.height=Math.floor(w*3/4)+'px';
  const h=w*3/4;
  if(!isTouch)cv.style.marginTop=Math.max(0,(innerHeight-h)/2)+'px';
  else if(innerWidth<innerHeight)cv.style.marginTop=Math.max(0,(innerHeight-200-h)/2)+'px';
  else cv.style.marginTop=Math.max(0,(innerHeight-h)/2)+'px';
}
addEventListener('resize',resize); resize();

addEventListener('keydown',e=>{
  unlockAudio();
  if(keyMap[e.code]){keyHeld[keyMap[e.code]]=true;dirTap[keyMap[e.code]]=true;e.preventDefault();}
  if(!e.repeat){
    if(['KeyZ','Enter','Space','KeyJ'].includes(e.code)){aPressed=true;e.preventDefault();}
    if(['KeyX','ShiftLeft','ShiftRight','Escape','Backspace','KeyK'].includes(e.code)){bPressed=true;e.preventDefault();}
  }
});
addEventListener('keyup',e=>{ if(keyMap[e.code]) keyHeld[keyMap[e.code]]=false; });
addEventListener('blur',()=>{DIRS.forEach(d=>{keyHeld[d]=false;padHeld[d]=false;});});

const dpad=document.getElementById('dpad');
const arrEls={}; DIRS.forEach(d=>arrEls[d]=dpad.querySelector('.'+d));
let padPid=null;
function padVisual(){DIRS.forEach(d=>arrEls[d].classList.toggle('on',padHeld[d]));}
function padFrom(e){
  const r=dpad.getBoundingClientRect();
  const dx=e.clientX-(r.left+r.width/2), dy=e.clientY-(r.top+r.height/2);
  DIRS.forEach(d=>padHeld[d]=false);
  if(Math.hypot(dx,dy)>=14){
    const s=((Math.round(Math.atan2(dy,dx)/(Math.PI/4))%8)+8)%8; // 0=right,2=down,4=left,6=up
    if(s===7||s===0||s===1) padHeld.right=true;
    if(s===1||s===2||s===3) padHeld.down=true;
    if(s===3||s===4||s===5) padHeld.left=true;
    if(s===5||s===6||s===7) padHeld.up=true;
  }
  padVisual();
}
dpad.addEventListener('pointerdown',e=>{e.preventDefault();unlockAudio();padPid=e.pointerId;try{dpad.setPointerCapture(e.pointerId);}catch(_){}padFrom(e);});
dpad.addEventListener('pointermove',e=>{if(e.pointerId===padPid)padFrom(e);});
['pointerup','pointercancel','lostpointercapture'].forEach(t=>dpad.addEventListener(t,e=>{
  if(e.pointerId===padPid){padPid=null;DIRS.forEach(d=>padHeld[d]=false);padVisual();}
}));
function bindBtn(id,fn){
  const el=document.getElementById(id);
  el.addEventListener('pointerdown',e=>{e.preventDefault();unlockAudio();fn();el.classList.add('on');});
  ['pointerup','pointercancel','pointerleave'].forEach(t=>el.addEventListener(t,()=>el.classList.remove('on')));
}
bindBtn('btnA',()=>aPressed=true);
bindBtn('btnB',()=>bPressed=true);
cv.addEventListener('pointerdown',e=>{
  e.preventDefault(); unlockAudio();
  const r=cv.getBoundingClientRect();
  tapPt={x:(e.clientX-r.left)/r.width*W, y:(e.clientY-r.top)/r.height*H};
  aPressed=true;
});
document.addEventListener('contextmenu',e=>e.preventDefault());
function tapped(d){return dirTap[d]||(held[d]&&!prevHeld[d]);}
function takeA(){if(aPressed){aPressed=false;return true;}return false;}
function takeB(){if(bPressed){bPressed=false;return true;}return false;}
function hit(r,p){return p&&p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h;}

// ------------------------------------------------------------ audio
let AC=null,master=null,muted=false;
function unlockAudio(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=0.22;master.connect(AC.destination);}catch(e){AC=null;}}
  if(AC&&AC.state==='suspended'){try{AC.resume();}catch(e){}}
}
function toneAt(freq,dur,type,vol,t){
  if(!AC||muted)return;
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0008,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.03);
}
function tone(f,d,type='square',v=0.25,delay=0){if(AC)toneAt(f,d,type,v,AC.currentTime+delay);}
const sfx={

  hurt(){tone(180,0.22,'sawtooth',0.28);tone(120,0.2,'square',0.15,0.05);},
  heal(){[523,659,784,1046].forEach((f,i)=>tone(f,0.14,'triangle',0.3,i*0.07));},
  heart(){[784,988].forEach((f,i)=>tone(f,0.12,'triangle',0.3,i*0.08));},
  spare(){[523,659,784,1046,1318].forEach((f,i)=>tone(f,0.2,'triangle',0.3,i*0.09));},
  save(){[1046,1318,1568].forEach((f,i)=>tone(f,0.3,'sine',0.25,i*0.12));},
  item(){[659,784,1046,784,1046,1318].forEach((f,i)=>tone(f,0.12,'square',0.15,i*0.08));}

    mel:[72,76,79,84,0,79,84,0, 77,81,84,89,0,84,89,0, 79,83,86,91,0,86,91,0, 84,0,79,0,84,0,0,0],
    bass:[48,0,0,0,48,0,0,0, 53,0,0,0,53,0,0,0, 55,0,0,0,55,0,0,0, 48,0,0,0,48,0,0,0]}

let song=null,songStep=0,nextNote=0;
function playSong(name){
  const s=SONGS[name]; if(song===s)return;
  song=s;songStep=0; if(AC)nextNote=AC.currentTime+0.08;
}
function musicTick(){
  if(!AC||!song||muted)return;
  if(nextNote<AC.currentTime)nextNote=AC.currentTime+0.05;
  while(nextNote<AC.currentTime+0.2){
    const m=song.mel[songStep%song.mel.length];
    if(m)toneAt(NOTE(m),song.len*0.85,song.wave,0.09,nextNote);
    const b=song.bass[songStep%song.bass.length];
    if(b)toneAt(NOTE(b),song.len*1.6,'triangle',0.16,nextNote);
    nextNote+=song.len;songStep++;
  }
}
const muteBtn=document.getElementById('mute');

  rows.forEach((r,j)=>{[...r].forEach((ch,i)=>{const col=pal[ch];if(col){x.fillStyle=col;x.fillRect(i,j,1,1);}});});
  return c;
}

// ------------------------------------------------------------ map
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
// tiles: 0 grass,1 path,2 tree,3 water,4 flowers,5 wall,6 roof,7 bridge,8 door,9 window,10 dark grass
const SOLID=new Set([2,3,5,6,8,9]);
const map=[];
for(let y=0;y<MH;y++){map.push(new Array(MW).fill(0));}
function setT(x,y,t){if(x>=0&&x<MW&&y>=0&&y<MH)map[y][x]=t;}
(function buildMap(){
  const r=rng(865);
  for(let x=15;x<48;x++)for(let y=0;y<MH;y++)setT(x,y,10);
  for(let x=0;x<MW;x++){setT(x,0,2);setT(x,1,2);setT(x,13,2);setT(x,14,2);}
  for(let y=0;y<MH;y++){setT(0,y,2);setT(59,y,2);}
  for(let x=1;x<59;x++){setT(x,7,1);setT(x,8,1);}
  // houses
  for(const hx of [2,9]){
    for(let x=hx;x<hx+4;x++){setT(x,2,6);setT(x,3,6);setT(x,4,9);}
    setT(hx+1,4,8);
  }
  // village flowers
  for(let i=0;i<22;i++){const x=1+Math.floor(r()*13),y=2+Math.floor(r()*11);if(map[y][x]===0)setT(x,y,4);}
  // woods
  const clear=[[15,5,16,10],[21,4,24,10],[32,4,35,11],[41,4,44,10],[45,4,47,10],[27,9,28,11]];
  const inClear=(x,y)=>clear.some(c=>x>=c[0]&&x<=c[2]&&y>=c[1]&&y<=c[3]);
  for(let x=15;x<48;x++)for(let y=2;y<13;y++){
    if(y===7||y===8||inClear(x,y))continue;
    const p=(y===6||y===9)?0.14:0.55;
    if(r()<p)setT(x,y,2);
  }
  // river + bridge
  for(let x=48;x<=50;x++)for(let y=2;y<13;y++)setT(x,y,(y===7||y===8)?7:3);
  // end meadow
  for(let i=0;i<40;i++){const x=51+Math.floor(r()*8),y=2+Math.floor(r()*11);if(map[y][x]===0)setT(x,y,4);}
  // keep a couple of spots clear
  setT(5,10,0);setT(11,10,0);setT(7,5,0);setT(14,5,0);setT(14,6,0);
})();
const mapCv=document.createElement('canvas');mapCv.width=MW*T;mapCv.height=MH*T;
(function renderMap(){
  const m=mapCv.getContext('2d');const r=rng(42);
  const R=(c,x,y,w,h)=>{m.fillStyle=c;m.fillRect(x,y,w,h);};
  for(let ty=0;ty<MH;ty++)for(let tx=0;tx<MW;tx++){
    const t=map[ty][tx],X=tx*T,Y=ty*T;
    const dark=tx>=15&&tx<48;
    const g=dark?'#4a8a40':'#5fae4e',g2=dark?'#3e7a36':'#4e9a40';
    R(g,X,Y,T,T);
    if(t===0||t===10||t===2||t===4){for(let i=0;i<3;i++)R(g2,X+Math.floor(r()*15),Y+Math.floor(r()*15),1,2);}
    if(t===1){R('#d9b77a',X,Y,T,T);for(let i=0;i<3;i++)R('#c9a466',X+Math.floor(r()*15),Y+Math.floor(r()*15),2,1);}
    if(t===4){const cols=['#ffffff','#ffd84a','#ff7aa8','#b48aff'];for(let i=0;i<3;i++){const fx=X+2+Math.floor(r()*11),fy=Y+2+Math.floor(r()*11);R(cols[Math.floor(r()*4)],fx,fy,2,2);R('#ffe9a0',fx,fy,1,1);}}
    if(t===2){
      R('#6b4423',X+6,Y+10,4,6);
      const c1=dark?'#2a6a32':'#2f7a3a',c2=dark?'#358040':'#3f9a4a';
      R(c1,X+4,Y,8,1);R(c1,X+2,Y+1,12,2);R(c1,X+1,Y+3,14,5);R(c1,X+2,Y+8,12,2);R(c1,X+4,Y+10,8,1);
      R(c2,X+4,Y+2,4,2);R(c2,X+3,Y+4,2,2);
    }
    if(t===3){R('#3a7bd5',X,Y,T,T);R('#6aa8f0',X+2,Y+4,5,1);R('#6aa8f0',X+9,Y+11,5,1);}
    if(t===7){R('#9a6a3a',X,Y,T,T);for(let i=0;i<T;i+=4)R('#7a4f2a',X+i,Y,1,T);if(ty===7)R('#5a3a1a',X,Y,T,2);if(ty===8)R('#5a3a1a',X,Y+14,T,2);}
    if(t===6){R('#c0504a',X,Y,T,T);for(let i=2;i<T;i+=4)R('#9a3a36',X,Y+i,T,1);}
    if(t===5||t===9||t===8){R('#efe0b8',X,Y,T,T);R('#c8b890',X,Y+14,T,2);}
    if(t===9){R('#6a4a2a',X+4,Y+3,8,7);R('#9fd4ff',X+5,Y+4,6,5);R('#6a4a2a',X+7,Y+4,1,5);}

class Typer{
  constructor(){this.set('');}
  set(t){this.full=t;this.n=0;this.done=!t.length;}
  update(dt){
    if(this.done)return;
    const before=Math.floor(this.n);this.n+=dt*42;
    const now=Math.floor(this.n);
    if(now>before&&now%2===0&&this.full[now]&&this.full[now]!==' ')sfx.blip();
    if(this.n>=this.full.length){this.n=this.full.length;this.done=true;}
  }
  skip(){this.n=this.full.length;this.done=true;}
}
let DLG=null;
function say(pages,onDone){
  pages=pages.filter(Boolean).map(fmt);
  if(!pages.length){onDone&&onDone();return;}
  DLG={pages,i:0,typer:new Typer(),onDone};DLG.typer.set(pages[0]);
}
function updateDlg(dt){
  DLG.typer.update(dt);
  if(takeA()||takeB()){
    if(!DLG.typer.done)DLG.typer.skip();
    else{DLG.i++;
      if(DLG.i>=DLG.pages.length){const f=DLG.onDone;DLG=null;f&&f();}
      else DLG.typer.set(DLG.pages[DLG.i]);}
  }
}

function R(c,x,y,w,h){ctx.fillStyle=c;ctx.fillRect(x,y,w,h);}
function font(size){ctx.font=`bold ${size}px "Courier New",Courier,monospace`;}
function txt(s,x,y,col='#fff',size=10,align='left'){font(size);ctx.fillStyle=col;ctx.textAlign=align;ctx.textBaseline='top';ctx.fillText(s,x,y);}
function wrap(s,maxW,size){
  font(size);const out=[];
  for(const para of s.split('\n')){
    let line='';
    for(const w of para.split(' ')){const t=line?line+' '+w:w;if(ctx.measureText(t).width>maxW&&line){out.push(line);line=w;}else line=t;}
    out.push(line);
  }
  return out;
}
function drawTyped(ty,x,y,maxW,size=10,lh=13,col='#fff'){
  const lines=wrap(ty.full,maxW,size);let n=Math.floor(ty.n);
  for(const L of lines){if(n<=0)break;txt(L.slice(0,n),x,y,col,size);n-=L.length+1;y+=lh;}
}
function frame(x,y,w,h,border='#fff'){R('#000',x,y,w,h);R(border,x,y,w,2);R(border,x,y+h-2,w,2);R(border,x,y,2,h);R(border,x+w-2,y,2,h);}
function spr(s,x,y,flip=false,scale=1){
  const w=s.width*scale,h=s.height*scale;
  if(flip){ctx.save();ctx.translate(Math.round(x)+w,Math.round(y));ctx.scale(-1,1);ctx.drawImage(s,0,0,w,h);ctx.restore();}
  else ctx.drawImage(s,Math.round(x),Math.round(y),w,h);
}
function circ(x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();}
function drawCloud(cx,cy,s,happy,t){
  const col=happy?'#f4f7ff':'#7d8496',sh=happy?'#c9d4ec':'#5c6375';
  const blob=(x,y)=>{circ(x-8*s,y+2*s,6*s);circ(x,y-3*s,8*s);circ(x+8*s,y+1*s,6*s);ctx.fillRect(x-12*s,y+1*s,24*s,7*s);};
  if(!happy&&s<2){ctx.fillStyle='#6ab0ff';for(let i=0;i<5;i++){const dx=(i-2)*5*s,dy=((t*40*s+i*13*s)%(14*s));ctx.fillRect(cx+dx,cy+9*s+dy,Math.max(1,s),2*s);}}
  else{const cs=['#ff6b6b','#ffd84a','#6bdc7a','#6ab0ff'];cs.forEach((c,i)=>{ctx.fillStyle=c;ctx.fillRect(cx-12*s,cy+9*s+i*s,24*s,s);});}

    B.typer.update(dt);
    if(tapPt){const i=BTN.findIndex(r=>hit(r,tapPt));if(i>=0)B.menu=i;else aPressed=false;}
    if(tapped('left')){B.menu=(B.menu+2)%3;sfx.move();}
    if(tapped('right')){B.menu=(B.menu+1)%3;sfx.move();}
    if(takeA()){sfx.select();openMenu(B.menu);}
    return;
  }
  if(B.state==='sub'){
    const n=B.list.length;
    if(tapPt){
      const bi=BTN.findIndex(r=>hit(r,tapPt));
      if(bi>=0){aPressed=false;B.menu=bi;sfx.select();openMenu(bi);return;}
      let i=-1;for(let j=0;j<n;j++)if(hit(listRect(j),tapPt))i=j;
      if(i>=0)B.sub=i;else aPressed=false;
    }
    if(tapped('down')&&B.sub+2<n){B.sub+=2;sfx.move();}
    if(tapped('up')&&B.sub-2>=0){B.sub-=2;sfx.move();}
    if(tapped('right')&&B.sub%2===0&&B.sub+1<n){B.sub++;sfx.move();}
    if(tapped('left')&&B.sub%2===1){B.sub--;sfx.move();}
    if(takeB()){B.state='menu';return;}
    if(takeA()){sfx.select();choose();}
    return;
  }
  if(B.state==='attack')updateAttack(dt);
}

function feetBlocked(x,y){
  const pts=[[x+2,y+11],[x+10,y+11],[x+2,y+15.5],[x+10,y+15.5]];
  for(const [px,py] of pts){if(SOLID.has(tileAt(px,py)))return true;}
  for(const e of ENTS){if(!e.solid)continue;
    if(x+10>e.x&&x+2<e.x+e.w&&y+15.5>e.y+e.h-6&&y+11<e.y+e.h)return true;}
  return x<0||x>MW*T-12;
}
function nearestTalk(){
  let best=null,bd=26;const px=P.x+6,py=P.y+10;
  for(const e of ENTS){if(e.enemy&&!G.flags.spared[e.enemy])continue;
    const d=Math.hypot(e.x+e.w/2-px,e.y+e.h/2-py);if(d<bd){bd=d;best=e;}}
  return best;
}
let pendingBattle=null,transT=0;
function updateWorld(dt){
  G.gateCD=Math.max(0,G.gateCD-dt);
  if(DLG){updateDlg(dt);return;}
  let dx=(held.right?1:0)-(held.left?1:0),dy=(held.down?1:0)-(held.up?1:0);
  const moving=dx||dy;if(dx&&dy){dx*=0.707;dy*=0.707;}
  const sp=74;
  if(dx){const nx=P.x+dx*sp*dt;if(!feetBlocked(nx,P.y))P.x=nx;P.dir=dx>0?1:-1;}
  if(dy){const ny=P.y+dy*sp*dt;if(!feetBlocked(P.x,ny))P.y=ny;}
  P.walkT=moving?P.walkT+dt:0;
  if(!G.flags.lantern&&P.x+12>15*T){P.x=15*T-12;
    if(G.gateCD<=0){G.gateCD=2;say(["* It's too dark to go into the woods without a light.","* Maybe Grandpa Owl can help. He's by the houses."]);}return;}
  for(const e of ENTS){
    if(e.enemy&&!G.flags.spared[e.enemy]&&Math.abs(P.x+6-(e.x+e.w/2))<20){
      const id=e.enemy;say(ENEMIES[id].pre,()=>{pendingBattle=id;transT=0;G.state='trans';});return;}
  }
  if(spareCount()===3&&!G.flags.ended&&P.x>53*T){startEnding();return;}
  if(takeA()){const e=nearestTalk();if(e)talkTo(e);}
  const s=spareCount();
  playSong((P.x<15*T||P.x>48*T||s===3)?'village':'woods');
}
function darkness(){
  if(G.flags.ended)return 0;
  const x=P.x+6,base=[0.62,0.46,0.3,0][spareCount()];
  const w0=15*T,w1=48*T;if(x<w0-16||x>w1+16)return 0;
  let f=1;if(x<w0+16)f=(x-(w0-16))/32;if(x>w1-16)f=Math.min(f,(w1+16-x)/32);
  return base*Math.max(0,Math.min(1,f));
}

let last=performance.now();
function update(dt){
  G.time+=dt;G.fade=Math.max(0,G.fade-dt*2);
  if(G.state==='title')updateTitle();
  else if(G.state==='select')updateSelect();
  else if(G.state==='world')updateWorld(dt);
  else if(G.state==='trans'){transT+=dt;if(transT>0.7){startBattle(pendingBattle);}}
  else if(G.state==='battle')updateBattle(dt);
  else if(G.state==='theend'){if(takeA()){G.state='title';G.titleSel=0;resetEnts();}}
}

  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  if(G.state==='title')drawTitle();
  else if(G.state==='select')drawSelect();
  else if(G.state==='world')drawWorld();

  else if(G.state==='theend')drawEnd();

}

}
